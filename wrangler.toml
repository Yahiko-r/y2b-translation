name = "youtube-dialogue-writer"
main = "src/index.ts"
compatibility_date = "2026-05-28"

[vars]
GEMINI_MODEL = "gemini-3-flash-preview"
# Smaller chunks give faster first output and more focused generated headings.
TRANSLATION_CHUNK_CHARS = "6000"
